name: Docker Image CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            CIVITAI_API_KEY=${{ secrets.CIVITAI_API_KEY }}
          secrets: |
            "CIVITAI_API_KEY=${{ secrets.CIVITAI_API_KEY }}"
          push: true
          tags: |
            aaulink/chara2img-api:latest
            aaulink/chara2img-api:${{ github.sha }}

      - name: Deploy to RunPod serverless endpoint
        run: |
          curl --fail --request PATCH \
            --url "https://api.runpod.io/v2/serverless/${RUNPOD_ENDPOINT_ID}" \
            --header "Authorization: Bearer ${RUNPOD_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"image\": \"aaulink/chara2img-api:${GITHUB_SHA}\"}"
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: trfqy15xtd1vrz
